<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q5 - Advanced CSS Selectors</title>
<link rel="stylesheet" href="q5.css">
</head>
<body>
<header><h1>Advanced CSS Selectors</h1></header>
<main>
  <ul class="item-list">
    <li>Item One</li>
    <li>Item Two</li>
    <li>Item Three</li>
    <li>Item Four</li>
    <li>Item Five</li>
  </ul>

  <form>
    <input type="text" placeholder="Text input (attribute selector)">
    <input type="email" placeholder="Email input">
  </form>

  <p><a href="https://example.com">Secure link (https)</a></p>
  <p><a href="http://example.com">Insecure link (http)</a></p>

  <div class="combinator-demo">
    <p>Parent paragraph</p>
    <span>Direct child span (>)</span>
    <p>Sibling paragraph (+)</p>
    <p>General sibling paragraph (~)</p>
  </div>
</main>
</body>
</html>
