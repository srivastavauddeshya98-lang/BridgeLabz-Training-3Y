<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q9 - Outline and Focus Styling</title>
<link rel="stylesheet" href="q9.css">
</head>
<body>
<header><h1>Outline and Focus Styling Form</h1></header>
<main>
  <form class="styled-form">
    <label>Name</label>
    <input type="text" class="outline-solid" placeholder="Solid outline on focus">

    <label>Email</label>
    <input type="email" class="outline-dashed" placeholder="Dashed outline on focus">

    <label>Message</label>
    <textarea class="outline-dotted" placeholder="Dotted outline on focus, with offset"></textarea>
  </form>
</main>
</body>
</html>
