<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>
  <header>
    <h1>Image Filter Gallery</h1>
    <p>Hover over an image to remove its filter</p>
  </header>
  <main>
    <section class="gallery">
      <figure>
        <img class="blur" src="https://picsum.photos/seed/mountain/400/300" alt="Mountain landscape">
        <figcaption>Blur</figcaption>
      </figure>
      <figure>
        <img class="grayscale" src="https://picsum.photos/seed/city/400/300" alt="City skyline">
        <figcaption>Grayscale</figcaption>
      </figure>
      <figure>
        <img class="sepia" src="https://picsum.photos/seed/forest/400/300" alt="Forest path">
        <figcaption>Sepia</figcaption>
      </figure>
      <figure>
        <img class="brightness" src="https://picsum.photos/seed/beach/400/300" alt="Beach at sunset">
        <figcaption>Brightness</figcaption>
      </figure>
      <figure>
        <img class="contrast" src="https://picsum.photos/seed/river/400/300" alt="River valley">
        <figcaption>Contrast</figcaption>
      </figure>
      <figure>
        <img class="hue" src="https://picsum.photos/seed/desert/400/300" alt="Desert dunes">
        <figcaption>Hue-rotate</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
