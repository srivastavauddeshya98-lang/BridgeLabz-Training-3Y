<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLA University Map</title>
</head>
<body>

    <!-- Google Map showing GLA University, Mathura -->
    <h1>GLA University, Mathura</h1>

    <!-- loading="lazy" makes the map load only when it is close to being visible on the page -->
    <iframe
        src="https://www.google.com/maps?q=GLA+University,+Mathura&output=embed"
        width="80%"
        height="450"
        title="Google Map of GLA University, Mathura"
        loading="lazy">
    </iframe>

</body>
</html>
