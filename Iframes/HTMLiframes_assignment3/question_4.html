<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>

<!-- Frameset divides the page into a top navigation frame and a bottom welcome frame -->
<frameset rows="30%,70%">
    <frame src="navigation.html" title="Navigation">
    <frame src="welcome.html" title="Welcome Message">
</frameset>

</html>
