<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q6 - Blog Grid</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blog">
  <header class="header">
    <h1>My Blog</h1>
    <nav><a href="#">Home</a><a href="#">Archive</a><a href="#">Contact</a></nav>
  </header>

  <aside class="sidebar">
    <h3>Categories</h3>
    <ul>
      <li>Technology</li>
      <li>Travel</li>
      <li>Food</li>
    </ul>
  </aside>

  <main class="posts">
    <article class="post">
      <h2>Post One</h2>
      <p>This is a short preview of the first blog post.</p>
    </article>
    <article class="post">
      <h2>Post Two</h2>
      <p>This is a short preview of the second blog post.</p>
    </article>
  </main>

  <footer class="footer">
    <p>Contact us: hello@myblog.com</p>
  </footer>
</div>
</body>
</html>
