<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q5 - Pricing Flexbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pricing">
  <div class="plan">
    <h2>Basic</h2>
    <p class="price">$9/mo</p>
    <p>Good for individuals</p>
  </div>
  <div class="plan highlight">
    <h2>Pro</h2>
    <p class="price">$19/mo</p>
    <p>Best for small teams</p>
  </div>
  <div class="plan">
    <h2>Enterprise</h2>
    <p class="price">$49/mo</p>
    <p>For large organizations</p>
  </div>
</div>
</body>
</html>
