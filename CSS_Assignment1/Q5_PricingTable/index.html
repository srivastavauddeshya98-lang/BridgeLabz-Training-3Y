<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="page-title">Choose Your Plan</h1>

<div class="pricing-container">

  <div class="plan">
    <h2>Basic</h2>
    <p class="price">$9<span>/mo</span></p>
    <ul>
      <li>1 User</li>
      <li>5GB Storage</li>
      <li>Email Support</li>
    </ul>
    <a href="#" class="btn">Choose Plan</a>
  </div>

  <div class="plan popular">
    <h2>Standard</h2>
    <p class="price">$19<span>/mo</span></p>
    <ul>
      <li>5 Users</li>
      <li>50GB Storage</li>
      <li>Priority Support</li>
      <li>Analytics Dashboard</li>
    </ul>
    <a href="#" class="btn">Choose Plan</a>
  </div>

  <div class="plan">
    <h2>Premium</h2>
    <p class="price">$39<span>/mo</span></p>
    <ul>
      <li>Unlimited Users</li>
      <li>500GB Storage</li>
      <li>24/7 Support</li>
    </ul>
    <a href="#" class="btn">Choose Plan</a>
  </div>

</div>

</body>
</html>
