<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Layout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="sticky-header">
  <h2>MyBrand</h2>
  <nav>
    <a href="#hero">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section id="hero" class="hero">
  <h1>Welcome to MyBrand</h1>
</section>

<section id="about" class="about">
  <div class="about-text">
    <h2>About Us</h2>
    <p>We build modern, accessible websites using the latest CSS and layout techniques for our clients across the globe.</p>
  </div>
  <img src="https://picsum.photos/400/300" alt="About us" class="about-img">
</section>

<section id="services" class="services">
  <div class="service-box">Web Design</div>
  <div class="service-box">Development</div>
  <div class="service-box">SEO</div>
</section>

<section id="contact" class="contact">
  <h2>Get In Touch</h2>
  <form>
    <input type="text" placeholder="Your Name">
    <input type="email" placeholder="Your Email">
    <textarea rows="4" placeholder="Message"></textarea>
    <button type="submit">Send</button>
  </form>
</section>

<footer class="footer">
  <p>&copy; 2026 MyBrand. All rights reserved.</p>
</footer>

</body>
</html>
