<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>
<header>
    <h1>Student Portal</h1>
</header>

<main>
    <section class="card">
        <img src="https://picsum.photos/id/64/300/200" alt="Student workspace">

        <div class="content">
            <h2>Welcome Back</h2>
            <p>Log in to access your student dashboard.</p>

            <form>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">

                <div class="buttons">
                    <button type="submit">Login</button>
                    <button type="reset" class="reset">Reset</button>
                </div>
            </form>
        </div>
    </section>
</main>

<footer>
    <p>CSS Assignment 4 - Question 10</p>
</footer>
</body>
</html>
