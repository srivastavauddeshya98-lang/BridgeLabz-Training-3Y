<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
<header><h1>Box-Sizing Comparison</h1></header>

<main class="comparison">
    <section>
        <h2>Default Box Sizing</h2>
        <div class="box content-box">Width: 300px + padding + border</div>
        <p>The default content-box model adds padding and border to the declared width.</p>
    </section>

    <section>
        <h2>Border Box</h2>
        <div class="box border-box">Total Width: 300px</div>
        <p>With border-box, padding and border are included inside the declared width.</p>
    </section>
</main>

<footer><p>CSS Assignment 4 - Question 8</p></footer>
</body>
</html>
