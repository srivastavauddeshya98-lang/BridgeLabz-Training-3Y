<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- Student report using table attributes -->
    <h1>GLA University</h1>

    <h2>Student Report</h2>

    <table border="1">
        <tr>
            <th rowspan="2" title="Student information">Student</th>
            <th colspan="2">Marks</th>
        </tr>
        <tr>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td rowspan="5">Uddeshya Srivastava</td>
            <td>Java</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Data Structures</td>
            <td>82</td>
        </tr>
        <tr>
            <td>Database</td>
            <td>88</td>
        </tr>
        <tr>
            <td>Operating Systems</td>
            <td>80</td>
        </tr>
        <tr>
            <td>Web Development</td>
            <td>90</td>
        </tr>

        <tr>
            <td colspan="2"><strong>Total</strong></td>
            <td>425</td>
        </tr>
        <tr>
            <td colspan="2"><strong>Percentage</strong></td>
            <td>85%</td>
        </tr>
    </table>

</body>
</html>
