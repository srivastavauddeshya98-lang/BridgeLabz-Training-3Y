<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>

    <!-- Dropdowns for selecting travel preferences -->
    <h1>Travel Selection</h1>

    <label for="country">Country:</label>
    <select id="country" name="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state" name="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Goa</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city" name="city">
        <option selected>Mathura</option>
        <option>Jaipur</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place" name="place">
        <option selected>Taj Mahal</option>
        <option>Goa</option>
        <option>Jaipur</option>
    </select>

    <p>
        My choices are India as the country, Uttar Pradesh as the state,
        Mathura as the city, and the Taj Mahal as my favorite tourist place.
    </p>

</body>
</html>
