<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Form Builder</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f8; }
    #formContainer { max-width: 400px; margin: 40px auto; padding: 25px; background: #fff; border-radius: 8px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 15px; padding: 10px 20px; }
    pre { max-width: 400px; margin: 20px auto; padding: 15px; background: #272822; color: #a6e22e; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="formContainer"></div>
  <pre id="output">Submitted data will appear here.</pre>
  <script src="Q4.js"></script>
</body>
</html>
