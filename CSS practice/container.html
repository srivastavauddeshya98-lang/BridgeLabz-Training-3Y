<!DOCTYPE html>
<html>
<head>
    <title>Welcome Page</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0ece4;
            padding: 40px;
            margin: 0;
        }

        .container {
            width: 460px;
            margin: 40px auto;
            padding: 32px 36px;
            background-color: #ffffff;
            border: 1px solid #e8dccb;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h2 {
            font-size: 24px;
            color: #2b2b2b;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #7cb9d8;
            padding-bottom: 12px;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #4a4a4a;
            margin-bottom: 16px;
        }

        .highlight {
            background-color: #411d73;
            color: #ffffff;
            padding: 3px 14px;
            margin: 0 2px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to page</h2>
        <p>
            Here, some color and other
            <span class="highlight">content</span>
            consists of
        </p>
        <p>
            <span class="highlight">this</span>
            place and different
            properties are
        </p>
        <p>
            Following paragraph shows
            different properties of
            paragraph and other elements.
        </p>
        <p>
            The page contains various
            examples and information.
        </p>
    </div>
</body>
</html>
