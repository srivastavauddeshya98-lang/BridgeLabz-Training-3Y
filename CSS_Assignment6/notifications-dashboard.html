<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="notifications-dashboard.css">
</head>
<body class="bg-light">
  <header class="text-center py-4 bg-dark text-white">
    <h1>Notifications</h1>
  </header>

  <main class="container py-4">
    <!-- Card groups all the alerts neatly -->
    <div class="card shadow-sm">
      <div class="card-header fw-bold">Recent Activity</div>
      <div class="card-body">

        <!-- Contextual alerts: success, info, danger -->
        <div class="alert alert-success" role="alert">
          <strong>New message:</strong> You have 3 unread messages from the team.
        </div>
        <div class="alert alert-info" role="alert">
          <strong>Tip:</strong> You can customize your dashboard from Settings.
        </div>
        <div class="alert alert-danger" role="alert">
          <strong>Warning:</strong> Your storage is almost full.
        </div>

        <!-- Dismissible alert: needs Bootstrap's JS for the close button -->
        <div class="alert alert-warning alert-dismissible fade show" role="alert">
          <strong>Reminder:</strong> Your subscription renews in 5 days.
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Summary well: bordered, padded, light background -->
        <div class="bg-light border rounded p-3 mt-4">
          <h2 class="h5">Summary</h2>
          <p class="mb-0">4 notifications today: 1 success, 1 tip, 1 warning and 1 reminder.</p>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
