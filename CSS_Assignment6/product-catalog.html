<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="product-catalog.css">
</head>
<body class="bg-light">
  <header class="text-center py-4 bg-dark text-white">
    <h1>ShopEasy Catalog</h1>
  </header>

  <main class="container py-4">
    <!-- col-12: 1 column on phones, col-sm-6: 2 on tablets, col-md-3: 4 on desktops -->
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://picsum.photos/seed/watch/300/200" class="card-img-top" alt="Smart watch">
          <div class="card-body text-center">
            <h2 class="h5 card-title">Smart Watch</h2>
            <p class="fw-bold text-success">&#8377;4,999</p>
            <a href="#" class="btn btn-primary">Add to Cart</a>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://picsum.photos/seed/headphones/300/200" class="card-img-top" alt="Headphones">
          <div class="card-body text-center">
            <h2 class="h5 card-title">Headphones</h2>
            <p class="fw-bold text-success">&#8377;2,499</p>
            <a href="#" class="btn btn-primary">Add to Cart</a>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://picsum.photos/seed/backpack/300/200" class="card-img-top" alt="Backpack">
          <div class="card-body text-center">
            <h2 class="h5 card-title">Backpack</h2>
            <p class="fw-bold text-success">&#8377;1,799</p>
            <a href="#" class="btn btn-primary">Add to Cart</a>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm product-card">
          <img src="https://picsum.photos/seed/sneakers/300/200" class="card-img-top" alt="Sneakers">
          <div class="card-body text-center">
            <h2 class="h5 card-title">Sneakers</h2>
            <p class="fw-bold text-success">&#8377;3,299</p>
            <a href="#" class="btn btn-primary">Add to Cart</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
