<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="personal-portfolio.css">
</head>
<body class="bg-light text-dark">
  <!-- p-5: padding, text-center: centered text, bg-white: white background -->
  <header class="text-center p-5 bg-white border-bottom">
    <div class="container">
      <!-- img-fluid: scales with parent, rounded-circle: round photo -->
      <img src="https://picsum.photos/seed/profile/200/200" alt="Profile photo"
           class="img-fluid rounded-circle mb-3 profile-img">
      <h1 class="fw-bold">Uddeshya Srivastava</h1>
      <p class="lead">Aspiring Full-Stack Developer</p>
      <div class="mt-4 mb-3">
        <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
        <a href="#" class="btn btn-outline-dark">Download CV</a>
      </div>
    </div>
  </header>

  <main class="container text-center">
    <section class="mt-4 mb-3">
      <h2 class="fw-bold">About Me</h2>
      <p>I enjoy building clean, responsive websites and learning new technologies every day.</p>
    </section>

    <!-- form-control styles the inputs -->
    <section class="mt-4 mb-5 p-4 bg-white rounded shadow-sm mx-auto form-box" id="contact">
      <h2 class="fw-bold mb-3">Contact Me</h2>
      <form>
        <input type="text" class="form-control mb-3" placeholder="Your name">
        <input type="email" class="form-control mb-3" placeholder="Your email">
        <textarea class="form-control mb-3" rows="3" placeholder="Your message"></textarea>
        <button type="button" class="btn btn-success">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="text-center p-3 bg-dark text-white">
    <p class="mb-0">&copy; 2026 Uddeshya Srivastava</p>
  </footer>
</body>
</html>
